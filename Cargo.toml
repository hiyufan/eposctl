[package]
name = "eposctl"
version = "0.1.1"
edition = "2024"
description = "Control EPOS gaming headsets without the EPOS Gaming Suite"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_System_Variant", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Accessibility"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
